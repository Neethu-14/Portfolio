<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradAiops" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141518" />
      <stop offset="100%" stop-color="#0B0C0E" />
    </linearGradient>
    <linearGradient id="goldGradAiops" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E2B778" />
      <stop offset="100%" stop-color="#C79A5B" />
    </linearGradient>
    <linearGradient id="blueGradAiops" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="380" fill="url(#bgGradAiops)" />
  <rect x="1" y="1" width="598" height="378" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1" />

  <!-- Grid overlay -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="80" x2="600" y2="80" />
    <line x1="0" y1="160" x2="600" y2="160" />
    <line x1="0" y1="240" x2="600" y2="240" />
    <line x1="0" y1="320" x2="600" y2="320" />
    <line x1="150" y1="0" x2="150" y2="380" />
    <line x1="300" y1="0" x2="300" y2="380" />
    <line x1="450" y1="0" x2="450" y2="380" />
  </g>

  <!-- Central Cluster Diagram -->
  <circle cx="300" cy="180" r="110" fill="none" stroke="rgba(199,154,91,0.15)" stroke-width="1" stroke-dasharray="4,4" />
  <circle cx="300" cy="180" r="70" fill="none" stroke="rgba(96,165,250,0.2)" stroke-width="1.5" />

  <!-- Kubernetes / AI Central Node -->
  <rect x="250" y="145" width="100" height="70" rx="10" fill="#1C1E23" stroke="#C79A5B" stroke-width="1.5" />
  <circle cx="300" cy="170" r="12" fill="url(#goldGradAiops)" />
  <text x="300" y="202" fill="#F3EFE7" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">AI-OPS AGENT</text>

  <!-- Worker Nodes -->
  <!-- Node 1 -->
  <rect x="90" y="100" width="80" height="50" rx="8" fill="#181A1E" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
  <circle cx="110" cy="120" r="4" fill="#77B58A" />
  <text x="135" y="123" fill="#A4A8B0" font-family="'IBM Plex Mono', monospace" font-size="9" text-anchor="middle">node-01: ok</text>
  <line x1="170" y1="125" x2="250" y2="165" stroke="rgba(119,181,138,0.4)" stroke-width="1.5" stroke-dasharray="3,3" />

  <!-- Node 2 -->
  <rect x="430" y="100" width="80" height="50" rx="8" fill="#181A1E" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
  <circle cx="450" cy="120" r="4" fill="#77B58A" />
  <text x="475" y="123" fill="#A4A8B0" font-family="'IBM Plex Mono', monospace" font-size="9" text-anchor="middle">node-02: ok</text>
  <line x1="430" y1="125" x2="350" y2="165" stroke="rgba(119,181,138,0.4)" stroke-width="1.5" stroke-dasharray="3,3" />

  <!-- Node 3 (Root Cause / Alert) -->
  <rect x="250" y="270" width="100" height="50" rx="8" fill="#181A1E" stroke="rgba(248,113,113,0.4)" stroke-width="1" />
  <circle cx="270" cy="290" r="4" fill="#F87171" />
  <text x="310" y="293" fill="#F87171" font-family="'IBM Plex Mono', monospace" font-size="9" text-anchor="middle">RCA: Recovered</text>
  <line x1="300" y1="215" x2="300" y2="270" stroke="rgba(248,113,113,0.4)" stroke-width="1.5" stroke-dasharray="3,3" />

  <!-- Terminal window top left -->
  <rect x="30" y="25" width="220" height="42" rx="6" fill="#121316" stroke="rgba(255,255,255,0.08)" />
  <circle cx="46" cy="46" r="4" fill="#EF4444" opacity="0.8" />
  <circle cx="60" cy="46" r="4" fill="#F59E0B" opacity="0.8" />
  <circle cx="74" cy="46" r="4" fill="#10B981" opacity="0.8" />
  <text x="94" y="50" fill="#C79A5B" font-family="'IBM Plex Mono', monospace" font-size="10">k8s-cluster // active</text>

  <!-- Tag top right -->
  <rect x="420" y="25" width="150" height="42" rx="6" fill="#121316" stroke="rgba(199,154,91,0.2)" />
  <text x="495" y="50" fill="#E2B778" font-family="'IBM Plex Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">HACK2HIRE TOP 4</text>
</svg>
