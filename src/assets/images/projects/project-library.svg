<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="libGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151619"/>
      <stop offset="100%" stop-color="#0B0C0E"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#libGrad)"/>

  <rect x="80" y="60" width="640" height="330" rx="10" fill="#1C1D21" stroke="rgba(199,154,91,0.3)" stroke-width="1.5"/>
  <rect x="80" y="60" width="640" height="40" rx="10" fill="#151619"/>
  <circle cx="105" cy="80" r="5" fill="#D9695F"/>
  <circle cx="125" cy="80" r="5" fill="#C79A5B"/>
  <circle cx="145" cy="80" r="5" fill="#77B58A"/>
  <text x="175" y="84" fill="#9A968C" font-family="monospace" font-size="12">FASTAPI_LIBRARY_REST_SERVICES // SWAGGER_DOCS</text>

  <!-- Left Endpoints list -->
  <rect x="105" y="120" width="280" height="245" rx="6" fill="#151619" stroke="rgba(243,239,231,0.08)"/>
  <text x="125" y="150" fill="#F3EFE7" font-family="serif" font-size="15">API Endpoints (FastAPI)</text>
  
  <rect x="125" y="170" width="240" height="36" rx="4" fill="#1C1D21"/>
  <rect x="135" y="178" width="45" height="20" rx="3" fill="#77B58A"/>
  <text x="142" y="192" fill="#0B0C0E" font-family="monospace" font-size="10" font-weight="bold">GET</text>
  <text x="190" y="193" fill="#F3EFE7" font-family="monospace" font-size="12">/api/v1/books</text>

  <rect x="125" y="215" width="240" height="36" rx="4" fill="#1C1D21"/>
  <rect x="135" y="223" width="45" height="20" rx="3" fill="#C79A5B"/>
  <text x="140" y="237" fill="#0B0C0E" font-family="monospace" font-size="10" font-weight="bold">POST</text>
  <text x="190" y="238" fill="#F3EFE7" font-family="monospace" font-size="12">/api/v1/issue</text>

  <rect x="125" y="260" width="240" height="36" rx="4" fill="#1C1D21"/>
  <rect x="135" y="268" width="45" height="20" rx="3" fill="#8C4352"/>
  <text x="142" y="282" fill="#F3EFE7" font-family="monospace" font-size="10" font-weight="bold">DEL</text>
  <text x="190" y="283" fill="#F3EFE7" font-family="monospace" font-size="12">/api/v1/books/{id}</text>

  <rect x="125" y="305" width="240" height="36" rx="4" fill="#1C1D21"/>
  <rect x="135" y="313" width="45" height="20" rx="3" fill="#77B58A"/>
  <text x="142" y="327" fill="#0B0C0E" font-family="monospace" font-size="10" font-weight="bold">GET</text>
  <text x="190" y="328" fill="#F3EFE7" font-family="monospace" font-size="12">/api/v1/stats/count</text>

  <!-- Right JSON response -->
  <rect x="400" y="120" width="295" height="245" rx="6" fill="#151619" stroke="rgba(243,239,231,0.08)"/>
  <text x="420" y="150" fill="#C79A5B" font-family="monospace" font-size="12">Response 200 OK (Postman):</text>
  <text x="420" y="180" fill="#77B58A" font-family="monospace" font-size="11">{</text>
  <text x="435" y="205" fill="#9A968C" font-family="monospace" font-size="11">"status": "success",</text>
  <text x="435" y="230" fill="#9A968C" font-family="monospace" font-size="11">"book_id": "BK-9021",</text>
  <text x="435" y="255" fill="#9A968C" font-family="monospace" font-size="11">"title": "Clean Architecture",</text>
  <text x="435" y="280" fill="#9A968C" font-family="monospace" font-size="11">"issued_to": "Neethu Chauhan",</text>
  <text x="435" y="305" fill="#9A968C" font-family="monospace" font-size="11">"due_date": "2026-10-15"</text>
  <text x="420" y="330" fill="#77B58A" font-family="monospace" font-size="11">}</text>
</svg>