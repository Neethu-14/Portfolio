  <text x="175" y="84" fill="#9A968C" font-family="monospace" font-size="12">AI_CODE_REVIEW_ASSISTANT // AST_BANDIT_RADON_METRICS</text>

  <!-- Left Code View -->
  <rect x="105" y="120" width="280" height="245" rx="6" fill="#151619" stroke="rgba(243,239,231,0.08)"/>
  <text x="125" y="150" fill="#9A968C" font-family="monospace" font-size="11">1  def execute_query(conn, user_input):</text>
  <text x="125" y="175" fill="#D9695F" font-family="monospace" font-size="11">2    query = f"SELECT * FROM users"</text>
  <text x="125" y="200" fill="#9A968C" font-family="monospace" font-size="11">3    cursor = conn.cursor()</text>
  <text x="125" y="225" fill="#9A968C" font-family="monospace" font-size="11">4    cursor.execute(query)</text>
  <text x="125" y="250" fill="#9A968C" font-family="monospace" font-size="11">5    return cursor.fetchall()</text>

  <rect x="125" y="280" width="240" height="65" rx="4" fill="#1C1D21"/>
  <text x="135" y="300" fill="#C79A5B" font-family="monospace" font-size="10">AST Complexity: Grade A (Radon 2.1)</text>
