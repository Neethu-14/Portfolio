  <rect x="400" y="120" width="295" height="245" rx="6" fill="#151619" stroke="rgba(199,154,91,0.3)"/>
  <text x="420" y="150" fill="#C79A5B" font-family="serif" font-size="15">AI Security &amp; Quality Audit</text>
  
  <rect x="420" y="170" width="255" height="55" rx="4" fill="rgba(217,105,95,0.12)" stroke="#D9695F"/>
