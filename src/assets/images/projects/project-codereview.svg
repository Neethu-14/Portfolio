  <text x="430" y="210" fill="#F3EFE7" font-family="sans-serif" font-size="10">String formatting used in SQL statement.</text>

  <rect x="420" y="235" width="255" height="110" rx="4" fill="rgba(119,181,138,0.12)" stroke="#77B58A"/>
  <text x="430" y="255" fill="#77B58A" font-family="monospace" font-size="10" font-weight="bold">✓ AI REMEDIATION PROPOSAL:</text>
  <text x="430" y="275" fill="#F3EFE7" font-family="monospace" font-size="10">cursor.execute(</text>
  <text x="445" y="295" fill="#F3EFE7" font-family="monospace" font-size="10">"SELECT * FROM users WHERE id=%s",</text>
  <text x="445" y="315" fill="#F3EFE7" font-family="monospace" font-size="10">(user_input,)</text>
  <text x="430" y="335" fill="#F3EFE7" font-family="monospace" font-size="10">)</text>
