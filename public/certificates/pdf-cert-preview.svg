<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPdf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#181A1F" />
      <stop offset="100%" stop-color="#0E0F12" />
    </linearGradient>
    <linearGradient id="goldPdf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E2B778" />
      <stop offset="100%" stop-color="#C79A5B" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#bgPdf)" />
  <rect x="2" y="2" width="596" height="396" fill="none" stroke="#C79A5B" stroke-width="1.5" opacity="0.4" />

  <!-- Document Icon Container -->
  <rect x="220" y="80" width="160" height="200" rx="6" fill="#141519" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
  
  <!-- PDF Fold Corner -->
  <polygon points="340,80 380,120 340,120" fill="#22242B" />
  <polyline points="340,80 340,120 380,120" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />

  <!-- Badge / PDF label -->
  <rect x="245" y="140" width="110" height="32" rx="4" fill="#E2B778" />
  <text x="300" y="161" fill="#0B0C0E" font-family="'IBM Plex Mono', monospace" font-size="14" font-weight="700" text-anchor="middle">OFFICIAL PDF</text>

  <!-- Lines inside doc -->
  <line x1="245" y1="195" x2="355" y2="195" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-linecap="round" />
  <line x1="245" y1="215" x2="330" y2="215" stroke="rgba(255,255,255,0.15)" stroke-width="2" stroke-linecap="round" />
  <line x1="245" y1="235" x2="345" y2="235" stroke="rgba(255,255,255,0.15)" stroke-width="2" stroke-linecap="round" />

  <!-- Text -->
  <text x="300" y="315" fill="#F3EFE7" font-family="'Fraunces', serif" font-size="19" font-weight="600" text-anchor="middle">Official Certificates Archive</text>
  <text x="300" y="340" fill="#9E9A92" font-family="'Inter', sans-serif" font-size="12" text-anchor="middle">8-Page Verified Credentials Bundle · 2024–2026</text>
</svg>
